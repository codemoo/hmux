# Disposable hmux frame server. This file is never sourced by the target tmux
# server. Its disabled prefix lets every ordinary Ctrl-b sequence pass through
# to the native target client inside the resizable framed body pane.
set -g prefix None
set -g prefix2 None
set -g mouse on
set -g exit-empty on
set -g exit-unattached on
set -g remain-on-exit off
set -g set-titles off
set -g visual-activity off
set -g visual-bell off
set -g set-clipboard external
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard"
set -as terminal-features ",xterm-256color:RGB"
set -g window-style "bg=#100f0f"
set -g window-active-style "bg=#100f0f"
set -g pane-border-status off

# The outer server owns the one stable header row. The LIVE SESSION pane layout
# is owned by a nested disposable body server in this server's regular pane.
set -g status-position top
set -g status on
set -g status-interval 2
set -g status-style "bg=#100f0f,fg=#cecdc3"
# Keep each user range present from the first paint. The values are visually
# blank until RunInner atomically replaces them with launcher-local tabs.
set -g @hmux_frame_tab1 "                      "
set -g @hmux_frame_tab2 "                       "
set -g @hmux_frame_tab3 "                       "
set -g @hmux_frame_tab4 "                       "
set -g @hmux_frame_tab5 "                       "
set -g @hmux_frame_tab6 "                       "
set -g @hmux_frame_tab7 "                       "
set -g @hmux_frame_tab8 "                       "
set -g @hmux_frame_tab9 "                       "
set -g status-format[0] "#[range=user|list]#[bold,fg=#4385be]  HMUX #[nobold,fg=#575653]/#[fg=#cecdc3] SESSION CONTROL#[norange]  #[bold,fg=#878580]TABS #[nobold]#[range=user|tab1]#{E:@hmux_frame_tab1}#[norange]#[range=user|tab2]#{E:@hmux_frame_tab2}#[norange]#[range=user|tab3]#{E:@hmux_frame_tab3}#[norange]#[range=user|tab4]#{E:@hmux_frame_tab4}#[norange]#[range=user|tab5]#{E:@hmux_frame_tab5}#[norange]#[range=user|tab6]#{E:@hmux_frame_tab6}#[norange]#[range=user|tab7]#{E:@hmux_frame_tab7}#[norange]#[range=user|tab8]#{E:@hmux_frame_tab8}#[norange]#[range=user|tab9]#{E:@hmux_frame_tab9}#[norange]#[align=right,fg=#878580]%b %d %I:%M %p  "
bind-key -n MouseDown1Status run-shell "~/.local/bin/hmux-agent frame-click --launcher '#{E:HMUX_FRAME_LAUNCHER}' --status-file '#{E:HMUX_FRAME_STATUS_FILE}' --mouse-range '#{mouse_status_range}' 2>/dev/null"

# A click still passes into the nested body server. Once movement turns it
# into a drag, the disposable outer server owns the selection and copies it
# through OSC 52; the final send-keys releases the click in the nested client.
# The target tmux server itself is never configured or decorated by hmux.
bind-key -n MouseDown1Pane send-keys -M
bind-key -n MouseUp1Pane send-keys -M
bind-key -n MouseDrag1Pane copy-mode -M
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; send-keys -M
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; send-keys -M
bind-key -n MouseDown2Pane send-keys -M
bind-key -n MouseUp2Pane send-keys -M
bind-key -n MouseDrag2Pane send-keys -M
bind-key -n MouseDragEnd2Pane send-keys -M
bind-key -n MouseDown3Pane send-keys -M
bind-key -n MouseUp3Pane send-keys -M
bind-key -n MouseDrag3Pane send-keys -M
bind-key -n MouseDragEnd3Pane send-keys -M
bind-key -n WheelUpPane send-keys -M
bind-key -n WheelDownPane send-keys -M

# Ghostty's private hmux sequences intentionally have no tmux key binding.
# They pass through both disposable servers and the frame-inner PTY proxy
# consumes them before the native target tmux sees them.
