# Disposable hmux body server. It owns the resizable LIVE SESSION pane frame
# and bottom helper below the outer server's fixed header. It is never sourced
# by the target tmux server.
set -g prefix None
set -g prefix2 None
set -g mouse on
set -g exit-empty on
set -g exit-unattached on
set -g remain-on-exit off
set -g set-titles off
set -g visual-activity off
set -g visual-bell off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g window-style "bg=#100f0f"
set -g window-active-style "bg=#100f0f"
set -g pane-border-status off

# The current binary enables the resizable pane border and helper only after
# validating that this is its launcher-specific disposable body server. Keeping
# the base config neutral preserves compatibility during an agent-first rollout.
set -g status off

# Mouse events over the target pane pass through instead of opening this
# disposable server's copy mode, pane menu or selection state.
bind-key -n MouseDown1Pane send-keys -M
bind-key -n MouseUp1Pane send-keys -M
bind-key -n MouseDrag1Pane send-keys -M
bind-key -n MouseDragEnd1Pane send-keys -M
bind-key -n MouseDown2Pane send-keys -M
bind-key -n MouseUp2Pane send-keys -M
bind-key -n MouseDrag2Pane send-keys -M
bind-key -n MouseDragEnd2Pane send-keys -M
bind-key -n MouseDown3Pane send-keys -M
bind-key -n MouseUp3Pane send-keys -M
bind-key -n MouseDrag3Pane send-keys -M
bind-key -n MouseDragEnd3Pane send-keys -M
bind-key -n WheelUpPane send-keys -M
bind-key -n WheelDownPane send-keys -M

# Private Ghostty sequences and every native tmux key pass to the active
# frame-inner pane proxy.
