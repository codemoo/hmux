[package]
name = "hmux-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Only the private sysctl adapter permits unsafe. All runtime crates continue to
# inherit the workspace's unsafe_code=forbid policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
