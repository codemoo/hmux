<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#17191d" />
    <meta name="color-scheme" content="only dark" />
    <link rel="icon" type="image/svg+xml" href="/icons/hmux-symbol.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-graphite.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="HMux" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="preload"
      href="/fonts/MonatendardNFM-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/MonatendardNFM-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>HMux · Your workspace, anywhere</title>
  </head>
  <body>
    <div id="app">
      <main class="boot-screen" role="status">
        <img
          src="/icons/hmux-symbol.svg"
          width="48"
          height="48"
          alt=""
        /><strong>HMux</strong>
        <p>Connecting to your workspace…</p>
        <a href="/">Open again</a>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
