name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protobuf-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Install verified protoc 35.1
        shell: bash
        run: |
          set -eu
          hmux_protoc_zip="$RUNNER_TEMP/hmux-protoc-35.1.zip"
          hmux_protoc_dir="$RUNNER_TEMP/hmux-protoc-35.1"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 --retry 2 \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip \
            --output "$hmux_protoc_zip"
          printf '%s  %s\n' '6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7' "$hmux_protoc_zip" | sha256sum --check --status
          unzip -q "$hmux_protoc_zip" -d "$hmux_protoc_dir"
          printf '%s\n' "$hmux_protoc_dir/bin" >> "$GITHUB_PATH"
      - run: make rust-proto-check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run check --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Install isolated integration tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux jq shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y tmux jq shellcheck
          fi
      - run: make rust-check shellcheck shfmt-check
      - run: make integration
      - run: make build
      - name: Verify complete native bundle
        shell: bash
        run: |
          case "$(rustc -vV | sed -n 's/^host: //p')" in
            aarch64-apple-darwin) hmux_platform=darwin-arm64 ;;
            x86_64-apple-darwin) hmux_platform=darwin-amd64 ;;
            x86_64-unknown-linux-gnu) hmux_platform=linux-amd64 ;;
            *) echo 'Unsupported CI host' >&2; exit 1 ;;
          esac
          HMUX_RUST_BUNDLE="$PWD/dist/web-$hmux_platform" make bundle-check
      - name: Inspect only the native test process
        run: cargo test -p hmux-service --lib reads_only_self_process_metadata --locked -- --ignored

  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and dependency tools
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Fetch advisory database and check locked dependencies
        shell: bash
        run: |
          set -eu
          export HMUX_ADVISORY_DB="$RUNNER_TEMP/hmux-rustsec-db"
          git clone --depth=1 https://github.com/RustSec/advisory-db.git "$HMUX_ADVISORY_DB"
          git -C "$HMUX_ADVISORY_DB" rev-parse HEAD
          make rust-dependencies
