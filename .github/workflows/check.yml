name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install macOS verification tools
        run: |
          brew install tmux jq shellcheck
      - run: make fmt-check
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./...
        working-directory: third_party/token-terrier-server
      - run: make shellcheck
      - run: make integration
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run check --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
  home-service-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/homeservice
      - run: go build ./cmd/hmux-web
