# New sessions start in these base directories.
# Enable "Create folder automatically" in the web dialog for a new child folder.
schema_version = 1
revision = "example"

[[profiles]]
id = "codex"
label = "Codex"
default_directory = "~/.hmux"
command = ["codex"]
tags = ["ai", "codex"]

[[profiles]]
